name: Monthly release

# Cuts a CalVer release (vYYYY.MM) with notes generated from the PRs merged
# since the last release. The scheduled run on the 1st releases the previous
# month, a manual run releases the current month. If that month already has a
# release, the tag gets a suffix: v2026.11.1, v2026.11.2, ...
on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cut the release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # A scheduled run on Dec 1 releases November 2026, a manual run on
          # Nov 20 releases November 2026 too.
          if [ "$EVENT_NAME" = "schedule" ]; then
            month="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m-01)"
          else
            month="$(date -u +%Y-%m-01)"
          fi
          base_tag="v$(date -u -d "$month" +%Y.%m)"
          title="$(date -u -d "$month" '+%B %Y')"

          # The last CalVer release, suffixed or not, and when it was published.
          last_release="$(gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]{4}\\.[0-9]{2}(\\.[0-9]+)?$"))] | sort_by(.publishedAt) | last // empty | "\(.tagName) \(.publishedAt)"')"

          search=""
          notes_args=()
          if [ -n "$last_release" ]; then
            since="${last_release#* }"
            search="merged:>$since"
            notes_args=(--notes-start-tag "${last_release% *}")
            echo "Last release: ${last_release% *}, published $since."
          else
            echo "No earlier release found."
          fi

          merged="$(gh pr list --state merged --base main --search "$search" --limit 1 --json number --jq 'length')"
          if [ "$merged" -eq 0 ]; then
            echo "No PRs merged since the last release, nothing to do."
            exit 0
          fi

          # v2026.11 if it is free, else the first free v2026.11.N.
          tag="$base_tag"
          n=0
          while gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; do
            n=$((n + 1))
            tag="$base_tag.$n"
          done
          if [ "$n" -gt 0 ]; then
            title="$title (update $n)"
          fi

          gh release create "$tag" --target main --title "$title" --generate-notes "${notes_args[@]}"
          echo "Created release $tag ($title)."
