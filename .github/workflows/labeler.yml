name: Pull Request Labeler

# pull_request_target runs with the base branch's workflow and config, so the
# token can label PRs from forks. This job never checks out or runs PR code.
on:
  - pull_request_target

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
