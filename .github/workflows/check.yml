name: Check projects.json

# A bad projects.json blanks the gallery, and Vercel deploys every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-projects.mjs
