<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Night — Guess the Country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a33;
    --surface: rgba(255,255,255,0.06);
    --surface-2: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.12);
    --text: #f4f6fb;
    --muted: #a6b0cc;
    --accent: #ffcf4a;
    --good: #3ddc97;
    --bad: #ff6b6b;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 15% -10%, #1d2a5c 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #2a1747 0%, transparent 55%),
      var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }

  /* ---------- Top bar ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: clamp(.75rem, 2vh, 1.25rem) clamp(1rem, 3vw, 2.5rem);
  }
  .brand { display: flex; align-items: center; gap: .6rem; font-family: "Fraunces", serif; font-weight: 800; font-size: clamp(1.1rem, 2vw, 1.5rem); letter-spacing: .01em; }
  .brand-dot { width: .7em; height: .7em; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent); }
  .stats { display: flex; gap: .6rem; align-items: center; }
  .pill {
    padding: .45rem .9rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
    font-weight: 600; font-size: clamp(.85rem, 1.3vw, 1.05rem); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pill b { color: var(--accent); }
  .icon-btn {
    width: 2.6rem; height: 2.6rem; border-radius: 12px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border); transition: background .2s;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 1.2rem; height: 1.2rem; }

  /* ---------- Stage ---------- */
  main { display: grid; place-items: center; padding: 0 clamp(1rem, 3vw, 2.5rem); min-height: 0; }
  .stage { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(1rem, 3vh, 2rem); min-height: 0; }

  .flag-wrap { position: relative; display: grid; place-items: center; flex: 1 1 auto; min-height: 0; width: 100%; }
  .flag {
    max-width: min(88vw, 1100px); max-height: 100%; height: auto; width: auto;
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    background: #fff;
    animation: flagIn .5s cubic-bezier(.2,.8,.2,1);
  }
  /* SVG flags need an explicit size to scale up */
  .flag.svg { height: min(52vh, 600px); }
  @keyframes flagIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .flag-error { color: var(--muted); text-align: center; font-size: 1.2rem; max-width: 30ch; }

  .answer-area { min-height: clamp(6rem, 18vh, 11rem); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: .5rem; }
  .prompt { font-family: "Fraunces", serif; font-weight: 600; font-size: clamp(1.6rem, 4vw, 3rem); color: var(--muted); }
  .hint { font-size: clamp(1rem, 2vw, 1.5rem); color: var(--accent); font-weight: 600; }
  .answer { font-family: "Fraunces", serif; font-weight: 800; font-size: clamp(2.2rem, 6.5vw, 5rem); line-height: 1.05; letter-spacing: -.01em; animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  .fact { font-size: clamp(1rem, 1.9vw, 1.45rem); color: var(--muted); max-width: 60ch; line-height: 1.45; animation: fade .6s .1s both; }
  .badge { display: inline-block; font-size: .55em; vertical-align: middle; margin-left: .5em; padding: .2em .6em; border-radius: 999px; background: rgba(255,207,74,.15); color: var(--accent); font-family: "Inter", sans-serif; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Controls ---------- */
  footer { padding: clamp(.75rem, 2.5vh, 1.5rem) clamp(1rem, 3vw, 2.5rem) clamp(1rem, 3vh, 2rem); display: flex; flex-direction: column; align-items: center; gap: .75rem; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .6rem;
    padding: .9rem 1.5rem; border-radius: 14px; font-weight: 700; font-size: clamp(1rem, 1.6vw, 1.2rem);
    background: var(--surface); border: 1px solid var(--border);
    transition: transform .15s, background .2s, box-shadow .2s;
  }
  .btn:hover { background: var(--surface-2); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn kbd { font: 600 .75em "Inter", sans-serif; padding: .15em .45em; border-radius: 6px; background: rgba(0,0,0,.3); border: 1px solid var(--border); opacity: .8; }
  .btn.primary { background: var(--accent); color: #1a1405; border-color: transparent; box-shadow: 0 8px 30px rgba(255,207,74,.25); }
  .btn.primary:hover { background: #ffd966; }
  .btn.primary kbd { background: rgba(0,0,0,.12); border-color: rgba(0,0,0,.15); }
  .btn.good { background: var(--good); color: #052016; border-color: transparent; box-shadow: 0 8px 30px rgba(61,220,151,.22); }
  .btn.good kbd { background: rgba(0,0,0,.12); border-color: rgba(0,0,0,.15); }
  .btn.bad { background: rgba(255,107,107,.14); color: #ffd1d1; border-color: rgba(255,107,107,.4); }
  .btn.bad:hover { background: rgba(255,107,107,.24); }
  .btn[hidden] { display: none; }
  .keys { color: var(--muted); font-size: .85rem; opacity: .7; text-align: center; }

  /* ---------- Start / end screens ---------- */
  .panel { text-align: center; max-width: 820px; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; animation: fade .5s both; }
  .panel h1 { font-family: "Fraunces", serif; font-weight: 800; font-size: clamp(2.6rem, 7vw, 5.5rem); line-height: 1; letter-spacing: -.02em; }
  .panel h1 em { font-style: normal; color: var(--accent); }
  .panel p.lead { color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.4rem); max-width: 44ch; line-height: 1.5; }
  .decks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; width: 100%; }
  .deck {
    text-align: left; padding: 1.1rem 1.2rem; border-radius: var(--radius);
    background: var(--surface); border: 2px solid var(--border); transition: border-color .2s, background .2s, transform .15s;
  }
  .deck:hover { background: var(--surface-2); transform: translateY(-2px); }
  .deck[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,207,74,.08); }
  .deck strong { display: block; font-size: 1.15rem; margin-bottom: .25rem; }
  .deck span { color: var(--muted); font-size: .92rem; line-height: 1.4; }
  .preview-strip { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  .preview-strip img { height: 38px; width: auto; border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .big-score { font-family: "Fraunces", serif; font-weight: 800; font-size: clamp(4rem, 14vw, 9rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .missed-list { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; max-width: 760px; }
  .missed-list span { padding: .35rem .75rem; border-radius: 999px; background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.3); font-size: .95rem; }

  /* Flash feedback */
  .flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  .flash.good { background: radial-gradient(circle at 50% 45%, rgba(61,220,151,.25), transparent 60%); animation: flash .7s; }
  .flash.bad { background: radial-gradient(circle at 50% 45%, rgba(255,107,107,.2), transparent 60%); animation: flash .7s; }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

  @media (max-width: 680px) {
    .decks { grid-template-columns: 1fr; }
    .keys { display: none; }
    .btn { padding: .8rem 1.1rem; }
    .btn kbd { display: none; }
    .flag.svg { height: auto; width: 88vw; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Flag Night</div>
    <div class="stats">
      <div class="pill" id="progress" hidden></div>
      <div class="pill" id="score" hidden></div>
      <button class="icon-btn" id="homeBtn" title="Back to start" aria-label="Back to start" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      </button>
      <button class="icon-btn" id="fsBtn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main id="main"></main>

  <footer id="footer"></footer>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="sr-only" aria-live="polite" id="live" style="position:absolute;left:-9999px;"></div>

<script>
// Flag images come from flagcdn.com (free, public SVGs keyed by ISO code).
const flagUrl = code => `https://flagcdn.com/${code}.svg`;

const COMMON = [
  ["us", "United States", "North America", "50 stars for the 50 states, 13 stripes for the original colonies."],
  ["gb", "United Kingdom", "Europe", "The Union Jack layers the crosses of St George, St Andrew and St Patrick."],
  ["ca", "Canada", "North America", "The maple leaf flag only became official in 1965."],
  ["mx", "Mexico", "North America", "An eagle eating a snake on a cactus — the Aztec sign for where to found Tenochtitlan."],
  ["br", "Brazil", "South America", "The globe shows the night sky over Rio on 15 November 1889, the day Brazil became a republic."],
  ["ar", "Argentina", "South America", "The face in the middle is the 'Sun of May', an Incan sun god symbol."],
  ["fr", "France", "Europe", "Les Bleus' tricolore: blue and red for Paris, white for the old monarchy."],
  ["de", "Germany", "Europe", "Black, red and gold date back to uniforms from the Napoleonic wars."],
  ["it", "Italy", "Europe", "Inspired by the French tricolore, swapped blue for green."],
  ["es", "Spain", "Europe", "The coat of arms includes the Pillars of Hercules — the Strait of Gibraltar."],
  ["jp", "Japan", "Asia", "Called the Hinomaru — the 'circle of the sun'."],
  ["cn", "China", "Asia", "The large star represents the Communist Party; the four small ones the people."],
  ["in", "India", "Asia", "The wheel in the middle — the Ashoka Chakra — has 24 spokes."],
  ["kr", "South Korea", "Asia", "The four black trigrams come from the I Ching and stand for heaven, earth, water and fire."],
  ["au", "Australia", "Oceania", "Shows the Southern Cross and a seven-pointed Commonwealth Star."],
  ["za", "South Africa", "Africa", "Adopted in 1994; the Y-shape represents different paths coming together."],
  ["eg", "Egypt", "Africa", "The golden eagle in the centre is the Eagle of Saladin."],
  ["ng", "Nigeria", "Africa", "Designed by a student, Michael Taiwo Akinkunmi, in a 1959 competition."],
  ["ru", "Russia", "Europe", "White, blue and red — the same colours as many Slavic flags."],
  ["se", "Sweden", "Europe", "One of the Nordic cross flags — the cross is shifted toward the pole."],
  ["gr", "Greece", "Europe", "Nine stripes — said to match the syllables of 'Freedom or Death' in Greek."],
  ["ie", "Ireland", "Europe", "Green and orange for two traditions, white for peace between them."],
  ["tr", "Türkiye", "Europe / Asia", "A white crescent and star on red, inspired by Ottoman banners."],
  ["ch", "Switzerland", "Europe", "One of only two square national flags in the world."],
  ["pt", "Portugal", "Europe", "The armillary sphere honours Portugal's age of ocean exploration."],
  ["jm", "Jamaica", "North America", "The only national flag with no red, white or blue."],
  ["ke", "Kenya", "Africa", "A traditional Maasai shield and two crossed spears sit in the middle."],
  ["id", "Indonesia", "Asia", "Red over white — nearly identical to Monaco's flag."],
].map(f => [...f, false]);

const UNIQUE = [
  ["np", "Nepal", "Asia", "The world's only non-rectangular national flag — two stacked pennants."],
  ["bt", "Bhutan", "Asia", "That's Druk, the Thunder Dragon, clutching jewels in its claws."],
  ["mz", "Mozambique", "Africa", "Features an AK-47 rifle, crossed with a hoe, over an open book."],
  ["cy", "Cyprus", "Europe", "It has a map of the island on it — in copper colour, a nod to the island's name."],
  ["xk", "Kosovo", "Europe", "A map of the country plus six stars for its main ethnic groups."],
  ["ki", "Kiribati", "Oceania", "A frigatebird flies over a sun rising from the Pacific waves."],
  ["lk", "Sri Lanka", "Asia", "A golden lion holding a sword, with sacred bo leaves in the corners."],
  ["ug", "Uganda", "Africa", "The bird is a grey crowned crane, standing on one leg."],
  ["pg", "Papua New Guinea", "Oceania", "Designed in 1971 by a 15-year-old student, Susan Karike."],
  ["dm", "Dominica", "North America", "Features the Sisserou parrot — one of very few national flags with purple."],
  ["bz", "Belize", "North America", "One of the busiest flags on Earth: two woodcutters, a mahogany tree and tools."],
  ["gb-wls", "Wales", "Europe", "Y Ddraig Goch — the red dragon. It's not on the Union Jack at all."],
  ["sc", "Seychelles", "Africa", "Five bands burst out from the bottom-left corner like rays."],
  ["lb", "Lebanon", "Asia", "A green cedar tree — the famous Cedar of Lebanon."],
  ["kh", "Cambodia", "Asia", "One of the few flags with a building on it: the temple of Angkor Wat."],
  ["sa", "Saudi Arabia", "Asia", "Carries the Islamic declaration of faith, so it's never flown at half-mast."],
  ["mh", "Marshall Islands", "Oceania", "The 24-point star stands for the islands' municipalities."],
  ["pw", "Palau", "Oceania", "A full moon over the Pacific — set slightly off-centre on purpose."],
  ["mn", "Mongolia", "Asia", "The symbol on the left is the Soyombo: fire, sun, moon and more."],
  ["kz", "Kazakhstan", "Asia", "A golden steppe eagle soars beneath a sun with 32 rays."],
  ["tm", "Turkmenistan", "Asia", "The stripe on the left holds five traditional carpet patterns."],
  ["sz", "Eswatini", "Africa", "A Nguni warrior shield with two spears and a staff."],
  ["bn", "Brunei", "Asia", "The crest has a royal umbrella, wings and two raised hands."],
  ["py", "Paraguay", "South America", "Its front and back are different — each side has its own emblem."],
  ["va", "Vatican City", "Europe", "The other square national flag, with the keys of St Peter."],
  ["mt", "Malta", "Europe", "The George Cross in the corner was awarded to the island in WWII."],
  ["bb", "Barbados", "North America", "A broken trident of Neptune — the break symbolises leaving colonial rule."],
  ["gt", "Guatemala", "North America", "The resplendent quetzal — a bird so prized it's also the currency's name."],
  ["ls", "Lesotho", "Africa", "The black shape is a mokorotlo, the traditional Basotho hat."],
  ["im", "Isle of Man", "Europe", "The triskelion — three armoured legs running in a circle."],
  ["mc", "Monaco", "Europe", "Red over white — practically identical to Indonesia's, just a different shape."],
  ["td", "Chad", "Africa", "Almost exactly the same as Romania's flag — only the blue is a shade darker."],
  ["bd", "Bangladesh", "Asia", "The red disc sits slightly toward the pole, so it looks centred when the flag flies."],
  ["zm", "Zambia", "Africa", "Everything's on the right: an orange African fish eagle above the stripes."],
].map(f => [...f, true]);

const DECKS = {
  mixed:  { label: "Mixed", desc: "Every flag, shuffled — easy wins and head-scratchers." },
  common: { label: "Common", desc: "Well-known flags. Great warm-up for the room." },
  unique: { label: "Fun & unique", desc: "Dragons, rifles, parrots and look-alikes." },
};

// ---- Session state (in memory only) ----
const state = {
  deck: "mixed",
  queue: [],
  i: 0,
  revealed: false,
  hintLevel: 0,
  correct: 0,
  played: 0,
  missed: [],
  screen: "start",
};

const $ = id => document.getElementById(id);
const main = $("main"), footer = $("footer");

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQueue(deck) {
  if (deck === "common") return shuffle(COMMON);
  if (deck === "unique") return shuffle(UNIQUE);
  return shuffle([...COMMON, ...UNIQUE]);
}

function preload(code) {
  if (!code) return;
  const img = new Image();
  img.src = flagUrl(code);
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ---------- Screens ----------
function renderStart() {
  state.screen = "start";
  $("progress").hidden = $("score").hidden = $("homeBtn").hidden = true;
  const sample = ["np", "bt", "br", "ki", "gb-wls", "jp", "mz", "dm"];
  main.innerHTML = `
    <div class="panel">
      <div class="preview-strip">${sample.map(c => `<img src="${flagUrl(c)}" alt="">`).join("")}</div>
      <h1>Guess the <em>flag</em></h1>
      <p class="lead">Put it on the big screen, shout out your guesses, then reveal. Pick a deck to start.</p>
      <div class="decks" role="group" aria-label="Choose a deck">
        ${Object.entries(DECKS).map(([key, d]) => {
          const n = key === "common" ? COMMON.length : key === "unique" ? UNIQUE.length : COMMON.length + UNIQUE.length;
          return `<button class="deck" data-deck="${key}" aria-pressed="${state.deck === key}">
            <strong>${d.label} · ${n}</strong><span>${d.desc}</span></button>`;
        }).join("")}
      </div>
    </div>`;
  footer.innerHTML = `
    <div class="controls"><button class="btn primary" id="startBtn">Start game <kbd>Enter</kbd></button></div>`;
  main.querySelectorAll(".deck").forEach(b => b.addEventListener("click", () => {
    state.deck = b.dataset.deck;
    main.querySelectorAll(".deck").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  $("startBtn").addEventListener("click", startGame);
  $("startBtn").focus();
}

function startGame() {
  Object.assign(state, { queue: buildQueue(state.deck), i: 0, correct: 0, played: 0, missed: [], screen: "play" });
  $("progress").hidden = $("score").hidden = $("homeBtn").hidden = false;
  renderFlag();
}

function updateStats() {
  $("progress").innerHTML = `Flag <b>${Math.min(state.i + 1, state.queue.length)}</b> / ${state.queue.length}`;
  $("score").innerHTML = `Score <b>${state.correct}</b>`;
}

function renderFlag() {
  state.revealed = false;
  state.hintLevel = 0;
  const [code, name] = state.queue[state.i];
  updateStats();
  main.innerHTML = `
    <div class="stage">
      <div class="flag-wrap">
        <img class="flag svg" id="flagImg" src="${flagUrl(code)}" alt="Mystery flag — guess the country">
      </div>
      <div class="answer-area" id="answerArea"><div class="prompt">Which country is this?</div></div>
    </div>`;
  $("flagImg").addEventListener("error", () => {
    $("flagImg").outerHTML = `<p class="flag-error">This flag couldn't load — check the internet connection. (It's ${escapeHtml(name)}.)</p>`;
  });
  renderControls();
  preload(state.queue[state.i + 1]?.[0]);
  $("live").textContent = `Flag ${state.i + 1} of ${state.queue.length}`;
}

function renderControls() {
  if (!state.revealed) {
    footer.innerHTML = `
      <div class="controls">
        <button class="btn" id="hintBtn">Hint <kbd>H</kbd></button>
        <button class="btn primary" id="revealBtn">Reveal answer <kbd>Space</kbd></button>
        <button class="btn" id="skipBtn">Skip <kbd>S</kbd></button>
      </div>
      <div class="keys">F fullscreen · H hint · Space reveal · S skip</div>`;
    $("hintBtn").onclick = showHint;
    $("revealBtn").onclick = reveal;
    $("skipBtn").onclick = () => mark(false);
    $("hintBtn").disabled = state.hintLevel >= 2;
    if (state.hintLevel >= 2) $("hintBtn").style.opacity = .4;
  } else {
    footer.innerHTML = `
      <div class="controls">
        <button class="btn good" id="gotBtn">We got it! <kbd>G</kbd></button>
        <button class="btn bad" id="missBtn">Missed it <kbd>M</kbd></button>
      </div>
      <div class="keys">G got it · M missed it — both move to the next flag</div>`;
    $("gotBtn").onclick = () => mark(true);
    $("missBtn").onclick = () => mark(false);
  }
}

function showHint() {
  if (state.revealed || state.hintLevel >= 2) return;
  state.hintLevel++;
  const [, name, continent] = state.queue[state.i];
  const parts = [`📍 ${continent}`];
  if (state.hintLevel >= 2) parts.push(`Starts with “${name[0]}” · ${name.replace(/[^A-Za-zÀ-ÿ]/g, "").length} letters`);
  $("answerArea").innerHTML = `<div class="prompt">Which country is this?</div><div class="hint">${escapeHtml(parts.join("   ·   "))}</div>`;
  renderControls();
}

function reveal() {
  if (state.revealed) return;
  state.revealed = true;
  const [, name, , fact, unique] = state.queue[state.i];
  $("answerArea").innerHTML = `
    <div class="answer">${escapeHtml(name)}${unique ? '<span class="badge">Fun flag</span>' : ""}</div>
    <div class="fact">${escapeHtml(fact)}</div>`;
  $("live").textContent = `It's ${name}. ${fact}`;
  renderControls();
}

function flash(kind) {
  const f = $("flash");
  f.className = "flash";
  void f.offsetWidth; // restart animation
  f.className = `flash ${kind}`;
}

function mark(gotIt) {
  state.played++;
  if (gotIt) { state.correct++; flash("good"); }
  else { state.missed.push(state.queue[state.i][1]); flash("bad"); }
  state.i++;
  if (state.i >= state.queue.length) renderEnd();
  else renderFlag();
}

function renderEnd() {
  state.screen = "end";
  updateStats();
  const pct = Math.round((state.correct / state.played) * 100);
  const verdict = pct >= 90 ? "Flag legends." : pct >= 70 ? "Seriously impressive." : pct >= 45 ? "Solid effort!" : "The flags won this round.";
  main.innerHTML = `
    <div class="panel">
      <p class="lead">${verdict}</p>
      <div class="big-score">${state.correct}<span style="color:var(--muted);font-size:.45em"> / ${state.played}</span></div>
      ${state.missed.length ? `<p class="lead" style="font-size:1rem">Ones that got away</p>
        <div class="missed-list">${state.missed.map(n => `<span>${escapeHtml(n)}</span>`).join("")}</div>` : `<p class="lead">A perfect round — not a single miss.</p>`}
    </div>`;
  footer.innerHTML = `
    <div class="controls">
      <button class="btn primary" id="againBtn">Play again <kbd>Enter</kbd></button>
      <button class="btn" id="decksBtn">Change deck</button>
    </div>`;
  $("againBtn").onclick = startGame;
  $("decksBtn").onclick = renderStart;
  $("againBtn").focus();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
}

$("fsBtn").onclick = toggleFullscreen;
$("homeBtn").onclick = renderStart;

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "f") { toggleFullscreen(); return; }
  if (state.screen === "start" && k === "enter") { e.preventDefault(); startGame(); return; }
  if (state.screen === "end" && k === "enter") { e.preventDefault(); startGame(); return; }
  if (state.screen !== "play") return;
  if (!state.revealed) {
    if (k === " " || k === "enter" || k === "arrowright") { e.preventDefault(); reveal(); }
    else if (k === "h") showHint();
    else if (k === "s") mark(false);
  } else {
    if (k === "g" || k === "y") { e.preventDefault(); mark(true); }
    else if (k === "m" || k === "n") { e.preventDefault(); mark(false); }
  }
});

renderStart();
</script>
